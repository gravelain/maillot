name: maillot

services:
  postgres:
    image: postgres:17-alpine
    container_name: maillot-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${HOST_POSTGRES_PORT}:${POSTGRES_PORT}"

    volumes:
      - ../data/postgres/data:/var/lib/postgresql/data

    networks:
      - backend-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  adminer:
    image: adminer:4-standalone
    container_name: maillot-adminer

    ports:
      - "${HOST_ADMINER_PORT}:8080"

    networks:
      - backend-network

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

  api:
    build:
      context: ../maillot-api
      dockerfile: Dockerfile.dev

    container_name: maillot-api

    volumes:
      - ../maillot-api:/app
      - /app/node_modules

    ports:
      - "${HOST_API_PORT}:3000"

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}
      PORT: 3000

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - backend-network

    restart: unless-stopped

networks:
  backend-network:
    driver: bridge
